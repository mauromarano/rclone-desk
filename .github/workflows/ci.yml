name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflows
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Secret scan
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend from frozen lock
        working-directory: frontend
        run: npm ci && npm run build

      - name: Audit npm lock
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify direct pins match Python lock
        run: python scripts/check-python-lock.py backend/requirements.txt backend/requirements.lock

      - name: Ruff lint
        run: |
          python -m pip install ruff==0.17.3
          ruff check --select F,E9 backend

      - name: Install locked Python runtime dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Audit Python lock
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.lock

      - name: Python static checks
        run: python -m compileall -q backend

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container
        run: docker build --pull --tag rclone-desk:ci .

      - name: Report all image findings including upstream-unfixed entries
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rclone-desk:ci
          format: table
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Gate fixable high and critical image findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rclone-desk:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Backend unit and local rclone integration tests
        run: >-
          docker run --rm -e APP_DISABLE_SCHEDULER=1
          -v "$GITHUB_WORKSPACE/backend:/app/backend:ro"
          rclone-desk:ci python -m unittest discover -v -s backend/tests

      - name: Smoke test container
        shell: bash
        run: |
          bind_directory=$(mktemp -d)
          trap 'docker rm -f rclone-desk-ci >/dev/null 2>&1 || true; sudo rm -rf -- "$bind_directory"' EXIT
          RCLONE_DESK_DATA_DIR="$bind_directory" ./scripts/prepare-data.sh
          docker run -d --name rclone-desk-ci \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -e APP_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -p 127.0.0.1:18000:8000 \
            --mount "type=bind,source=$bind_directory,target=/data" rclone-desk:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs rclone-desk-ci
          exit 1
