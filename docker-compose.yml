services:
  rclone-ui:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      APP_DATA: /data
      APP_ALLOWED_HOSTS: "${APP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:-}"
      TZ: UTC
    volumes:
      - type: bind
        source: ${RCLONE_DESK_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped
